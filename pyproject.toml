[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunnu-research-harness"
version = "0.3.0"
description = "Human-in-the-loop research automation harness for Hunan Normal University digital resources"
requires-python = ">=3.11"
# Exact pins, deliberately: the zip has no lock file, so a range would hand
# every installer a different dependency set -- and Playwright's version
# directly changes selector behavior, download events, and CDP connects.
# These are the versions the shipped test suite was validated against.
dependencies = ["pypdf==6.16.1"]

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
dev = ["pytest==8.4.2"]

[project.scripts]
hunnu-harness = "hunnu_harness.cli:main"
hunnu-harness-agent = "hunnu_harness.agent_entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hunnu_harness.navigator" = ["lexicon.default.json"]
"hunnu_harness.literature" = ["taxonomy_aliases.default.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
