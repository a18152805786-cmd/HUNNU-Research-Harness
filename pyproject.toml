[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunnu-research-harness"
version = "0.2.22"
description = "Human-in-the-loop research automation harness for Hunan Normal University digital resources"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7"]

[project.optional-dependencies]
browser = ["playwright>=1.49"]
dev = ["pytest>=8"]

[project.scripts]
hunnu-harness = "hunnu_harness.cli:main"
hunnu-harness-agent = "hunnu_harness.agent_entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
